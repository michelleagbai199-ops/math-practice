<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styleP.css">
</head>
<body>
    <div id="login-page">
        <h1>Math Practice</h1>
        <input type="text" id="student-name">
       <button onclick="handlelogin()">Start Practice</button>
    </div>
    <div id="quiz-page" class="screen hidden">
        <div id="timer-box">
            <span>Time Left: </span>
            <span id="timer">60:00</span>
        </div>
        <h2 id="subject-title">Questions</h2>
        <div id="question-box"></div>
       <button onclick="submitQuiz()">Submit Test</button>
        
    </div>
    <div id="results-page" class="screen hidden">
    <h1>Practice Complete!</h1>
    <h2 id="final-score">Percentage: 0%</h2>
    <button onclick="location.reload()">Try Again</button>
</div>
    <script src="scriptP.js"></script>
</body>
</html>
